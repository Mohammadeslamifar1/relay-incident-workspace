name: Verify Relay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements.lock -e ".[dev]"
      - run: .venv/bin/python -m black --check apps/api tests scripts migrations run.py
      - run: .venv/bin/python -m isort --check-only apps/api tests scripts migrations run.py
      - run: .venv/bin/python -m flake8 apps/api tests scripts migrations run.py
      - run: .venv/bin/python -m pytest --cov=relay --cov-fail-under=90
      - run: .venv/bin/python -m alembic upgrade head
      - run: .venv/bin/python -m alembic check
      - run: npm ci --prefix apps/web
      - run: npm run format:check --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
